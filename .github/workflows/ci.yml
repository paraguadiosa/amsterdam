name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Test (Node + bats)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install bats
        run: |
          curl -sSL https://github.com/bats-core/bats-core/archive/refs/tags/v1.11.0.tar.gz | tar -xz
          sudo ./bats-core-1.11.0/install.sh /usr/local

      - name: Node tests (80% coverage gate)
        run: npm test

      - name: Shell + HTML tests
        run: npm run test:shell

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: amsterdam:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm -d -p 3131:3131 --name amsterdam-ci amsterdam:ci
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3131/api/billing >/dev/null; then break; fi
            sleep 1
          done
          curl --fail http://localhost:3131/
          curl --fail http://localhost:3131/api/billing
          docker logs amsterdam-ci
          docker stop amsterdam-ci
