name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Test (Node + bats)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Node tests (80% coverage gate)
        run: npm test

      - name: Shell + HTML tests
        run: npm run test:shell

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t amsterdam .

      - name: Smoke test
        run: |
          docker run --rm -d -p 3131:3131 --name amsterdam-ci amsterdam
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3131/api/billing >/dev/null; then break; fi
            sleep 1
          done
          curl --fail http://localhost:3131/
          curl --fail http://localhost:3131/api/billing
          docker logs amsterdam-ci
          docker stop amsterdam-ci
